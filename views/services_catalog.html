<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كتالوج خدمات الشركة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>body{background:#07111f;color:#e5edf8;font-family:Tahoma,Arial,sans-serif}.card{background:#102039;border:1px solid #284363;box-shadow:0 12px 28px #0003}.input{background:#09172a;border:1px solid #284363;color:#edf5ff}.input:focus{outline:0;border-color:#34d399}.toast{position:fixed;left:1rem;bottom:1rem;z-index:70}</style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <main class="max-w-7xl mx-auto">
    <header class="card rounded-2xl p-5 md:p-7 flex flex-col md:flex-row items-start md:items-center justify-between gap-5 mb-6">
      <div><p class="text-emerald-300 text-xs font-bold mb-2">إعدادات الشركة · بوابة الزوار</p><h1 class="text-2xl font-black text-white"><i class="fa-solid fa-briefcase text-emerald-400 ml-2"></i>كتالوج خدمات الشركة</h1><p class="text-sm text-slate-400 mt-2">إدارة مستقلة للخدمات التي تظهر للزوار والعملاء: النوع، الترتيب، الوصف، والحالة.</p></div>
      <div class="flex flex-wrap gap-2"><a href="/" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-200 text-sm font-bold"><i class="fa-solid fa-house ml-1"></i>النظام الرئيسي</a><a href="/client-app/services.html" target="_blank" class="px-4 py-2.5 rounded-xl bg-sky-500/15 border border-sky-400/30 text-sky-200 text-sm font-bold"><i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>معاينة الزائر</a></div>
    </header>
    <section class="card rounded-2xl overflow-hidden">
      <div class="p-5 border-b border-slate-700 flex flex-col md:flex-row gap-3 md:items-center justify-between"><div><h2 class="font-extrabold text-white">الخدمات المعروضة</h2><p class="text-xs text-slate-400 mt-1">التغييرات تظهر في واجهة الزائر بعد الحفظ والتحديث.</p></div><div class="flex flex-wrap gap-2"><button onclick="seed()" class="px-4 py-2.5 rounded-xl bg-sky-500/15 border border-sky-400/30 text-sky-100 text-xs font-bold"><i class="fa-solid fa-wand-magic-sparkles ml-1"></i>إضافة الخدمات المقترحة</button><button onclick="load()" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-200 text-xs font-bold"><i class="fa-solid fa-rotate ml-1"></i>تحديث</button><button onclick="openModal()" class="px-4 py-2.5 rounded-xl bg-emerald-400 text-slate-950 text-xs font-extrabold"><i class="fa-solid fa-plus ml-1"></i>إضافة خدمة</button></div></div>
      <div id="list" class="p-5 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </section>
  </main>
  <div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur p-4 flex items-center justify-center"><form onsubmit="save(event)" class="card w-full max-w-xl rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-700 flex justify-between"><h3 id="title" class="font-extrabold">إضافة خدمة</h3><button type="button" onclick="closeModal()" class="text-slate-400">×</button></div><div class="p-5 space-y-4"><input id="id" type="hidden"><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><label class="text-xs font-bold">اسم الخدمة *<input id="name" required maxlength="200" class="input w-full mt-1.5 rounded-xl p-2.5"></label><label class="text-xs font-bold">رمز الخدمة<input id="code" maxlength="50" class="input w-full mt-1.5 rounded-xl p-2.5 font-mono"></label><label class="text-xs font-bold">نوع الخدمة<select id="category" class="input w-full mt-1.5 rounded-xl p-2.5"><option value="design">تصميم وإشراف هندسي</option><option value="execution">مقاولات وتنفيذ مبانٍ</option><option value="finishing">ترميم وتشطيبات وديكور</option><option value="systems">أنظمة كهرباء وطاقة وتكييف</option><option value="infrastructure">بنية تحتية ومساحة</option><option value="consulting">استشارات وتراخيص ومقايسات</option><option value="supply">توريد وتركيب</option><option value="general">خدمات عامة</option></select></label><label class="text-xs font-bold">ترتيب الظهور<input id="order" type="number" value="0" class="input w-full mt-1.5 rounded-xl p-2.5"></label><label class="text-xs font-bold">أيقونة Font Awesome<input id="icon" value="fa-solid fa-compass-drafting" class="input w-full mt-1.5 rounded-xl p-2.5 font-mono"></label><label class="flex gap-2 items-end pb-2 text-sm font-bold"><input id="active" type="checkbox" checked class="accent-emerald-400"> ظاهرة للزوار</label></div><label class="text-xs font-bold block">وصف الخدمة<textarea id="description" rows="4" maxlength="2000" class="input w-full mt-1.5 rounded-xl p-2.5"></textarea></label></div><div class="p-4 border-t border-slate-700 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-sm">إلغاء</button><button class="px-5 py-2 rounded-xl bg-emerald-400 text-slate-950 font-extrabold text-sm">حفظ</button></div></form></div>
  <div id="toast" class="toast hidden px-4 py-3 rounded-xl text-sm font-bold"></div>
  <script>
    let services=[]; const labels={design:'تصميم وإشراف هندسي',execution:'مقاولات وتنفيذ مبانٍ',finishing:'ترميم وتشطيبات وديكور',systems:'أنظمة كهرباء وطاقة وتكييف',infrastructure:'بنية تحتية ومساحة',consulting:'استشارات وتراخيص ومقايسات',supply:'توريد وتركيب',general:'خدمات عامة'};
    const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const headers=(extra={})=>{const t=localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('access_token');return {...extra,...(t?{Authorization:`Bearer ${t}`}:{})}};
    function toast(msg,bad=false){const e=document.getElementById('toast');e.textContent=msg;e.className=`toast px-4 py-3 rounded-xl text-sm font-bold ${bad?'bg-rose-500 text-white':'bg-emerald-400 text-slate-950'}`;setTimeout(()=>e.classList.add('hidden'),3500)}
    async function load(){const box=document.getElementById('list');box.innerHTML='<div class="col-span-full py-10 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</div>';try{const r=await fetch('/api/admin/client-users/services-catalog',{headers:headers()});const d=await r.json();if(!d.success)throw Error(d.message);services=d.services||[];box.innerHTML=services.length?services.map(s=>`<article class="rounded-2xl border ${+s.is_active?'border-emerald-500/30 bg-emerald-500/5':'border-slate-700 bg-slate-900/60 opacity-75'} p-4"><div class="flex justify-between gap-3"><div class="flex gap-3"><i class="${esc(s.icon)} text-emerald-300 text-xl mt-1"></i><div><h3 class="font-extrabold text-white">${esc(s.title)}</h3><p class="text-[11px] text-slate-400 mt-1">${esc(labels[s.category]||s.category)} · ترتيب ${s.display_order||0}</p></div></div><span class="text-[10px] ${+s.is_active?'text-emerald-300':'text-slate-400'}">${+s.is_active?'ظاهرة':'مخفية'}</span></div><p class="text-xs text-slate-400 leading-6 mt-3 min-h-10">${esc(s.description||'لا يوجد وصف')}</p><div class="border-t border-slate-700/70 mt-3 pt-3 flex justify-end gap-2"><button onclick="openModal(${s.id})" class="px-3 py-1.5 rounded-lg bg-slate-800 text-xs">تعديل</button><button onclick="removeService(${s.id})" class="px-3 py-1.5 rounded-lg bg-rose-500/15 text-rose-300 text-xs">حذف</button></div></article>`).join(''):'<div class="col-span-full text-center py-12 text-slate-400">لا توجد خدمات. استخدم زر الخدمات المقترحة أو أضف خدمة جديدة.</div>'}catch(e){box.innerHTML=`<div class="col-span-full text-center text-rose-300 py-10">${esc(e.message||'تعذر التحميل')}</div>`}}
    function openModal(i){const s=i?services.find(x=>+x.id===+i):null;document.getElementById('modal').classList.remove('hidden');document.getElementById('title').textContent=s?'تعديل خدمة':'إضافة خدمة';['id','name','code','description','icon','order'].forEach(k=>document.getElementById(k).value=s?({id:s.id,name:s.title,code:s.code||'',description:s.description||'',icon:s.icon||'fa-solid fa-compass-drafting',order:s.display_order||0}[k]):(k==='icon'?'fa-solid fa-compass-drafting':k==='order'?0:''));document.getElementById('category').value=s&&labels[s.category]?s.category:'general';document.getElementById('active').checked=s?+s.is_active===1:true}
    function closeModal(){document.getElementById('modal').classList.add('hidden')}
    async function save(e){e.preventDefault();const id=document.getElementById('id').value,p={title:document.getElementById('name').value,code:document.getElementById('code').value,category:document.getElementById('category').value,description:document.getElementById('description').value,icon:document.getElementById('icon').value,display_order:document.getElementById('order').value,is_active:document.getElementById('active').checked};const r=await fetch('/api/admin/client-users/services-catalog'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify(p)}),d=await r.json();if(!d.success)return toast(d.message,true);closeModal();toast(d.message);load()}
    async function removeService(id){if(!confirm('حذف هذه الخدمة؟'))return;const r=await fetch('/api/admin/client-users/services-catalog/'+id,{method:'DELETE',headers:headers()}),d=await r.json();if(!d.success)return toast(d.message,true);toast(d.message);load()}
    async function seed(){if(!confirm('إضافة أو تنسيق الخدمات المقترحة دون حذف تعديلاتك؟'))return;const r=await fetch('/api/admin/client-users/services-catalog/add-recommended',{method:'POST',headers:headers()}),d=await r.json();if(!d.success)return toast(d.message,true);toast(d.message);load()}
    load();
  </script>
</body></html>
