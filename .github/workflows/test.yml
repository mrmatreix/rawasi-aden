name: test-suite

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # قاعدة البيانات تُبنى تلقائياً من الصفر عند الإقلاع — لا ملف db في Git ولا بذرة مطلوبة
      - run: npm test
