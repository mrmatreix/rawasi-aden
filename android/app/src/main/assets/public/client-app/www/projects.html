<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>مشاريعك - بوابة عملاء رواسي عدن</title>
  <link rel="stylesheet" href="css/client-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="appHeader"></div>

  <div class="app-container">
    <div style="margin-bottom: 16px;">
      <h2 style="font-size: 1.25rem; font-weight: 800; color: #FFFFFF;">المشاريع الهندسية</h2>
      <p style="font-size: 0.8rem; color: var(--text-muted);">متابعة وتفاصيل كافة مشاريعك المعتمدة مع الشركة</p>
    </div>

    <!-- Search & Filter -->
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <div style="position: relative; flex: 1;">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 12px; top: 14px; color: var(--text-muted);"></i>
        <input type="text" id="searchInput" oninput="filterProjects()" placeholder="بحث باسم المشروع أو الكود..." class="form-input" style="padding-right: 36px;">
      </div>
      <select id="statusFilter" onchange="filterProjects()" class="form-select" style="width: 120px;">
        <option value="all">الكل</option>
        <option value="active">نشط</option>
        <option value="completed">مكتمل</option>
      </select>
    </div>

    <!-- Projects List Container -->
    <div id="projectsListContainer">
      <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--gold); margin-bottom: 10px;"></i>
        <p>جاري تحميل قائمة المشاريع...</p>
      </div>
    </div>
  </div>

  <div id="bottomNav"></div>

  <script src="js/secure-storage.js"></script>
  <script src="js/client-api.js"></script>
  <script src="js/client-auth.js"></script>
  <script src="js/client-app.js"></script>
  <script src="js/push-notifications.js"></script>

  <script>
    let allProjects = [];

    document.addEventListener('DOMContentLoaded', async () => {
      ClientApp.init('projects');
      const isAuth = await ClientAuth.requireAuth();
      if (!isAuth) return;

      loadProjects();
    });

    async function loadProjects() {
      try {
        const data = await ClientAPI.get('/projects');
        if (!data.success) throw new Error(data.message);
        allProjects = data.projects || [];
        renderProjects(allProjects);
      } catch (err) {
        ClientApp.showToast(err.message || 'فشل تحميل المشاريع', 'error');
      }
    }

    function renderProjects(projects) {
      const container = document.getElementById('projectsListContainer');
      if (!projects || projects.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 40px 20px;">
            <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; color: var(--text-muted); margin-bottom: 12px;"></i>
            <h3 style="font-size: 1rem; color: #FFFFFF; font-weight: bold;">لا توجد مشاريع مطابقة</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">لم يتم العثور على مشاريع مسجلة لحسابك حالياً</p>
          </div>
        `;
        return;
      }

      container.innerHTML = projects.map(p => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <span style="font-size: 0.72rem; color: var(--gold); font-weight: bold;">${p.code || 'مشروع هندسي'}</span>
              <h3 style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin: 2px 0 6px;">${p.name}</h3>
            </div>
            <span class="badge ${p.status === 'active' ? 'badge-active' : 'badge-approved'}">
              ${p.status === 'active' ? 'قيد التنفيذ' : 'مكتمل'}
            </span>
          </div>

          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; background: var(--bg-input); padding: 12px; border-radius: 12px; border: 1px solid var(--border);">
            <div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">قيمة العقد</div>
              <div style="font-size: 0.95rem; font-weight: 800; color: var(--gold);">${ClientApp.formatMoney(p.contract_value)}</div>
            </div>
            <div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">المستخلصات المصدرة</div>
              <div style="font-size: 0.95rem; font-weight: 800; color: #FFFFFF;">${p.bills_count || 0} مستخلص</div>
            </div>
            <div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">تاريخ البدء</div>
              <div style="font-size: 0.8rem; color: var(--text-main);">${ClientApp.formatDate(p.start_date)}</div>
            </div>
            <div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">تاريخ الانتهاء المخطط</div>
              <div style="font-size: 0.8rem; color: var(--text-main);">${ClientApp.formatDate(p.end_date)}</div>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <span style="font-size: 0.75rem; color: var(--text-muted);">نسبة الإنجاز الميداني</span>
            <span style="font-size: 0.85rem; font-weight: 800; color: var(--gold);">${p.progress_percentage || 0}%</span>
          </div>
          <div class="progress-container">
            <div class="progress-fill" style="width: ${Math.min(100, Math.max(0, p.progress_percentage || 0))}%;"></div>
          </div>

          <div style="display: flex; gap: 8px; margin-top: 14px;">
            <a href="project-details.html?id=${p.id}" class="btn btn-primary btn-sm" style="flex: 1;">
              <i class="fa-solid fa-eye"></i> تفاصيل المشروع
            </a>
            <a href="invoices.html?project_id=${p.id}" class="btn btn-secondary btn-sm" style="flex: 1;">
              <i class="fa-solid fa-file-invoice"></i> المستخلصات
            </a>
          </div>
        </div>
      `).join('');
    }

    function filterProjects() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const status = document.getElementById('statusFilter').value;

      const filtered = allProjects.filter(p => {
        const matchesQuery = (p.name && p.name.toLowerCase().includes(q)) || (p.code && p.code.toLowerCase().includes(q));
        const matchesStatus = status === 'all' || p.status === status;
        return matchesQuery && matchesStatus;
      });

      renderProjects(filtered);
    }
  </script>
</body>
</html>
