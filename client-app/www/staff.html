<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>فريق العمل - رواسي عدن</title><link rel="stylesheet" href="css/client-theme.css"><link rel="stylesheet" href="css/staff-workspace.css"><style>body{background:#091426;color:#f4f7fb;font-family:Cairo,sans-serif;margin:0;padding:24px}main{max-width:680px;margin:auto}header{color:#f5b42d;border-bottom:1px solid #2b435c;padding-bottom:16px}section,.card{background:#182d46;border-radius:16px;padding:18px;margin:16px 0}input,textarea,select{box-sizing:border-box;width:100%;background:#091426;color:white;border:1px solid #405771;border-radius:10px;padding:12px;margin:7px 0;font:inherit}button{background:#f5b42d;color:#091426;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer}button.secondary{background:#2b435c;color:white}button+button{margin:5px}label{display:block;margin-top:10px}.muted{color:#a5b7cb}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;font:inherit;color:#a5b7cb}</style></head><body><main><header>رواسي عدن / فريق العمل</header><p id="notice" role="status"></p><div id="notificationArea" class="hidden"><button id="alertsButton" type="button" class="secondary" aria-expanded="false">الإشعارات <span id="alertsCount">0</span></button><div id="alerts" class="hidden inbox-panel" aria-live="polite"><h2>صندوق المراسلات</h2><p class="muted">افتح الطلب لعرض المراسلة وتحديث حالة القراءة.</p><div id="inboxFilters" class="filters"><button type="button" data-filter="all" class="selected">الكل</button><button type="button" data-filter="unread">غير مقروءة</button><button type="button" data-filter="read">مقروءة</button><button type="button" data-filter="replied">تم الرد</button><button type="button" data-filter="unanswered">لم يُرد عليها</button></div><div id="inboxList"></div><h3>تنبيهات الإجراءات</h3><div id="alertItems"></div></div></div><section id="login"><h1>دخول فريق العمل</h1><form id="loginForm"><label>اسم المستخدم<input id="username" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>تسجيل الدخول</button></form><form id="pinForm" class="hidden"><label>رمز التحقق بخطوتين<input id="pin" inputmode="numeric" autocomplete="one-time-code" required></label><button>تأكيد الرمز</button></form><p><a href="index.html">العودة إلى تطبيق العملاء</a></p></section><section id="workspace" class="hidden"><h1 id="greeting"></h1><p class="muted">الطلبات والإجراءات المتاحة لحسابك</p><div class="row"><button id="refresh">تحديث الطلبات</button><button class="secondary" id="logout">تسجيل الخروج</button></div><div id="defaultSupervisor" class="hidden"><label>مشرف استقبال الطلبات الجديدة<select id="defaultSupervisorSelect"></select></label><button id="saveDefaultSupervisor">حفظ مشرف الاستقبال</button></div><div id="requests"></div></section><section id="detail" class="hidden"><button class="secondary" id="back">العودة للطلبات</button><h2 id="title"></h2><p id="summary"></p><div id="attachments"></div><h3 class="conversation-heading">مراسلات الطلب</h3><div id="history" class="conversation" aria-live="polite"></div><div id="pendingMessages"></div><div id="statusUpdate"><label>حالة الطلب<select id="statusSelect"><option value="new">طلب جديد</option><option value="under_review">قيد المراجعة الفنية</option><option value="pricing">جاري التسعير</option><option value="rejected">معتذر عنه / ملغي</option></select></label><button id="saveStatus">حفظ الحالة</button></div><div id="assignment"><label>المشرف المسؤول<select id="assignee"></select></label><button id="assign">تعيين المشرف</button></div><div id="review"><label>مراجعة المتطلبات والكميات<textarea id="notes" rows="3"></textarea></label><button id="saveReview">حفظ المراجعة والانتقال للتسعير</button></div><div id="quote"><label>تفاصيل العرض والكميات والأسعار<textarea id="details" rows="4"></textarea></label><label>مدة التنفيذ<input id="duration"></label><label>المبلغ الإجمالي<input id="amount" type="number" min="0" step="0.01"></label><button id="submitQuote">إرسال العرض للمدير العام</button></div><div id="manager"><label>ملاحظات المدير عند الإعادة<textarea id="managerNote" rows="2"></textarea></label><button id="approve">اعتماد وإرسال العرض للزائر</button><button class="secondary" id="returnQuote">إعادة العرض للمشرف</button></div><label>إرسال رسالة إلى<select id="recipient"><option value="visitor">الزائر</option></select></label><label>الرسالة<textarea id="message" rows="3"></textarea></label><button id="sendMessage">إرسال الرسالة</button></section></main><script src="js/dialogs.js"></script>
  <script src="js/staff-workspace.js?v=inbox-20261117"></script></body></html>
