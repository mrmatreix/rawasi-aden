<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي وعروض الأسعار</title><link rel="stylesheet" href="css/client-theme.css"></head>
<body><div id="appHeader"></div><main class="app-container"><div class="card"><h2>طلباتي وعروض الأسعار</h2><a href="services.html">طلب خدمة جديدة</a><div id="requests">جاري التحميل...</div></div></main><div id="bottomNav"></div>
<script src="js/dialogs.js"></script>
  <script src="js/secure-storage.js"></script><script src="js/client-api.js"></script><script src="js/client-auth.js"></script><script src="js/client-app.js"></script>
<script>
const labels={new:'طلب جديد',under_review:'قيد المراجعة',pricing:'قيد التسعير',pending_manager:'بانتظار موافقة الإدارة',manager_changes:'قيد تعديل العرض',quoted:'عرض السعر بانتظار قرارك',client_changes:'أُعيد بملاحظاتك',client_accepted:'وافقت على العرض',converted:'تم التحويل إلى مشروع',rejected:'معتذر عنه'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadRequests(){const node=document.getElementById('requests');try{const data=await ClientAPI.get('/my-service-requests');node.innerHTML=(data.requests||[]).map(r=>`<section class="card"><h3>${esc(r.request_no)} ${esc(r.project_name||'')}</h3><p>الحالة: ${esc(labels[r.status]||r.status)}</p>${r.quote?`<p>عرض رقم ${Number(r.quote.version)} — ${esc(r.quote.amount)} ${esc(r.quote.currency)}</p><p>مدة التنفيذ: ${esc(r.quote.duration)}</p><p style="white-space:pre-wrap">${esc(r.quote.details)}</p>${r.status==='quoted'?`<textarea id="note-${Number(r.id)}" placeholder="ملاحظاتك عند طلب التعديل"></textarea><div><button class="btn btn-primary" onclick="respond(${Number(r.id)},${Number(r.quote.id)},'accept')">الموافقة على العرض</button> <button class="btn btn-secondary" onclick="respond(${Number(r.id)},${Number(r.quote.id)},'changes')">إعادة العرض بملاحظات</button></div>`:''}`:''}<div><h4>مراسلات الطلب</h4>${(r.messages||[]).map(m=>`<p>${esc(m.actor_type==='client'?'أنت':'رواسي عدن')}: ${esc(m.message)}</p>`).join('')}<textarea id="message-${Number(r.id)}" placeholder="اكتب رسالة للمشرف"></textarea><button class="btn btn-secondary" onclick="sendMessage(${Number(r.id)})">إرسال الرسالة</button></div></section>`).join('')||'<p>لا توجد طلبات لهذا الحساب.</p>';}catch(e){node.textContent=e.message||'تعذر تحميل الطلبات';}}
async function respond(id,quoteId,decision){const note=document.getElementById('note-'+id).value.trim();if(decision==='changes'&&!note){alert('يرجى كتابة ملاحظاتك');return;}if(decision==='accept'&&!await UIDialog.confirm('تأكيد موافقتك على عرض السعر المعروض؟'))return;try{await ClientAPI.post('/my-service-requests/'+id+'/response',{decision,note,quote_id:quoteId});await loadRequests();}catch(e){alert(e.message||'تعذر إرسال الرد');}}
async function sendMessage(id){const el=document.getElementById('message-'+id);try{await ClientAPI.post('/my-service-requests/'+id+'/message',{message:el.value});await loadRequests();}catch(e){alert(e.message||'تعذر إرسال الرسالة');}}
document.addEventListener('DOMContentLoaded',async()=>{ClientApp.init('dashboard');if(await ClientAuth.requireAuth())await loadRequests();});
</script></body></html>
